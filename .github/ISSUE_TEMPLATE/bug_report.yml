name: Bug report
description: Report a reproducible failure
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include a minimal reproduction and expected behavior.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: PHP, Laravel and LiveQuery versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
